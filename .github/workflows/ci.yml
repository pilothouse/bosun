name: CI

# Build, test, and report coverage.
#
# Why `--test-product WorkbenchPackageTests` and not a bare `swift test`: the macOS GUI
# app (the `Workbench` executable) links a ~141 MB vendored `Vendor/libghostty.a` that is
# .gitignored and therefore absent in CI. A bare `swift test` builds the *whole* package —
# including the `Workbench` executable — and would fail at the link step with
# `ld: library 'ghostty' not found`. Scoping to the test product builds only the test
# bundle and its dependencies (Domain/Application/Infrastructure), none of which link
# libghostty, so it compiles and runs cleanly without the vendored archive. The SwiftLint
# build-tool plugin on those inner layers still runs (they're test dependencies).

on:
  push:
    branches: [master]
  pull_request:

# Permissions required by octocov-action:
#   contents: read        — checkout + read the test step's duration from the Actions API
#   pull-requests: write  — post the coverage report as a PR comment
#   actions: write        — store/read the previous report as a workflow artifact (for diff)
permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & coverage
    # Pinned to macos-26 (Xcode 26.x, Swift >= 6.2) on purpose. The SwiftLint build-tool
    # plugin emits a *prebuild* command, and Swift 6.1's SwiftPM rejects prebuild commands
    # whose executable comes from a binary artifact ("a prebuild command cannot use
    # executables built from source, including executable target 'swiftlint'"). That was a
    # toolchain bug fixed in swiftlang/swift-package-manager#8440, shipped in Swift 6.2.
    # `macos-latest` still resolves to macos-15 / Xcode 16.4 / Swift 6.1.2 (buggy), so the
    # build-tool plugin fails build planning and `swift test` never runs. macos-26's default
    # Xcode (26.x) carries the fix.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Test (with code coverage)
        # --disable-sandbox: the SwiftLint build-tool plugin on the inner layers needs to
        # run unsandboxed on a clean checkout (matches the documented local build path).
        # --test-product: build only the test bundle + its deps, never the libghostty-linked
        # Workbench executable (see header comment). The product name is "<PackageName>PackageTests".
        run: swift test --enable-code-coverage --disable-sandbox --test-product WorkbenchPackageTests

      - name: Export coverage to LCOV
        # SwiftPM emits raw LLVM coverage; octocov reads LCOV. Convert the merged test
        # bundle's profile with llvm-cov, dropping dependency and test sources.
        run: |
          set -euo pipefail
          bin_path="$(swift build --show-bin-path)"
          profdata="$(find "${bin_path}/codecov" -name '*.profdata' | head -n 1)"
          xctest="$(find "${bin_path}" -maxdepth 1 -name '*.xctest' | head -n 1)"
          binary="${xctest}/Contents/MacOS/$(basename "${xctest}" .xctest)"
          xcrun llvm-cov export \
            -format=lcov \
            -instr-profile "${profdata}" \
            -ignore-filename-regex='\.build/|Tests/' \
            "${binary}" > coverage.lcov
          echo "Wrote $(wc -l < coverage.lcov) lines to coverage.lcov"

      - name: Report coverage (octocov)
        uses: k1LoW/octocov-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
