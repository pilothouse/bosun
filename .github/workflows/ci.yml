name: CI

# Build, test, and report coverage.
#
# Why `--test-product BosunPackageTests` and not a bare `swift test`: the macOS GUI
# app (the `Bosun` executable) links a ~141 MB vendored `Vendor/libghostty.a` that is
# .gitignored and therefore absent in CI. A bare `swift test` builds the *whole* package —
# including the `Bosun` executable — and would fail at the link step with
# `ld: library 'ghostty' not found`. Scoping to the test product builds only the test
# bundle and its dependencies (Domain/Application/Infrastructure), none of which link
# libghostty, so it compiles and runs cleanly without the vendored archive. The SwiftLint
# build-tool plugin on those inner layers still runs (they're test dependencies).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:        # manual "Run workflow" button (also builds the .dmg, see `package` job)

# Permissions required by octocov-action:
#   contents: read        — checkout + read the test step's duration from the Actions API
#   pull-requests: write  — post the coverage report as a PR comment
#   actions: write        — store/read the previous report as a workflow artifact (for diff)
permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & coverage
    # Pinned to macos-26 (Xcode 26.x, Swift >= 6.2) on purpose. The SwiftLint build-tool
    # plugin emits a *prebuild* command, and Swift 6.1's SwiftPM rejects prebuild commands
    # whose executable comes from a binary artifact ("a prebuild command cannot use
    # executables built from source, including executable target 'swiftlint'"). That was a
    # toolchain bug fixed in swiftlang/swift-package-manager#8440, shipped in Swift 6.2.
    # `macos-latest` still resolves to macos-15 / Xcode 16.4 / Swift 6.1.2 (buggy), so the
    # build-tool plugin fails build planning and `swift test` never runs. macos-26's default
    # Xcode (26.x) carries the fix.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Test (with code coverage)
        # --disable-sandbox: the SwiftLint build-tool plugin on the inner layers needs to
        # run unsandboxed on a clean checkout (matches the documented local build path).
        # --test-product: build only the test bundle + its deps, never the libghostty-linked
        # Bosun executable (see header comment). The product name is "<PackageName>PackageTests".
        run: swift test --enable-code-coverage --disable-sandbox --test-product BosunPackageTests

      - name: Export coverage to LCOV
        # SwiftPM emits raw LLVM coverage; octocov reads LCOV. Convert the merged test
        # bundle's profile with llvm-cov, dropping dependency and test sources.
        run: |
          set -euo pipefail
          bin_path="$(swift build --show-bin-path)"
          profdata="$(find "${bin_path}/codecov" -name '*.profdata' | head -n 1)"
          xctest="$(find "${bin_path}" -maxdepth 1 -name '*.xctest' | head -n 1)"
          binary="${xctest}/Contents/MacOS/$(basename "${xctest}" .xctest)"
          xcrun llvm-cov export \
            -format=lcov \
            -instr-profile "${profdata}" \
            -ignore-filename-regex='\.build/|Tests/' \
            "${binary}" > coverage.lcov
          echo "Wrote $(wc -l < coverage.lcov) lines to coverage.lcov"

      - name: Report coverage (octocov)
        uses: k1LoW/octocov-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build the full app and ship a ready-to-run Bosun.dmg as a workflow artifact, so a pre-v1
  # build can be downloaded and run on another Mac. Runs only AFTER `test` passes (needs: test),
  # and only on master pushes + manual dispatch — never on PRs (keeps PR CI fast and avoids the
  # heavy libghostty build on every pull request).
  #
  # Unlike `test`, this job DOES build the libghostty-linked `Bosun` executable, so it needs
  # Vendor/libghostty.a (gitignored, ~141 MB). That archive is built from source by
  # scripts/build-libghostty.sh and cached: a cache hit skips the whole heavy path (zig + the
  # macOS 15.5 SDK + the ghostty clone + the Metal Toolchain), because the only other build input,
  # Sources/CGhostty/include/ghostty.h, is committed. The cache key hashes the build script, so a
  # change to it (or to the ghostty tag it pins) busts the cache and rebuilds.
  package:
    name: Package .dmg
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-release-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-release-
            ${{ runner.os }}-spm-

      - name: Cache libghostty
        id: ghostty
        uses: actions/cache@v4
        with:
          path: Vendor/libghostty.a
          key: ${{ runner.os }}-libghostty-${{ hashFiles('scripts/build-libghostty.sh') }}

      # Only on a cache miss: ghostty compiles Metal shaders at build time, so the Metal Toolchain
      # (a separately-downloaded Xcode component) must be present before build-libghostty.sh runs.
      - name: Download Metal Toolchain
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build libghostty
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: bash scripts/build-libghostty.sh

      - name: Build Bosun (release)
        # --disable-sandbox: the SwiftLint build-tool plugin on the inner layers needs to run
        # unsandboxed (same as the test job). --product Bosun builds the app executable, which
        # links Vendor/libghostty.a restored/built above.
        run: swift build -c release --disable-sandbox --product Bosun

      - name: Package .app + .dmg
        # Ad-hoc signed on purpose. The Developer ID key is never given to CI; releases are signed
        # and notarized by hand, outside this repo.
        env:
          CONFIG: release
          VERSION: 0.0.0-${{ github.sha }}
          BUILD: ${{ github.run_number }}
        run: bash scripts/package-app.sh

      - name: Upload Bosun.dmg
        uses: actions/upload-artifact@v4
        with:
          name: Bosun-dmg
          path: dist/Bosun.dmg
          if-no-files-found: error

