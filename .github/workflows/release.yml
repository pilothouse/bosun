name: Release

# Tag → ad-hoc DMG → workflow artifact. CI's whole job in a release.
#
# Push a `v*` tag (e.g. `v1.2.3`) and this builds the full libghostty-linked Bosun app, rolls
# Bosun.dmg, and uploads it as the `Bosun-dmg` ARTIFACT. It never touches the Release: everything
# from here on is done by hand from the private release-tooling repo, which downloads this artifact,
# signs and notarizes it, signs the Sparkle appcast, and uploads both to the Release. That repo holds
# every key; this workflow holds none, which is why it needs no secrets and only `contents: read`.
#
# The build path mirrors ci.yml's `package` job; the difference is the trigger (a tag, not a master
# push) and the version (from the tag, not 0.0.0-<sha>).
#
# What it produces is AD-HOC signed and NOT shippable — it is an input to the signing step, not a
# release candidate. Nothing here can put it in front of a user.
#
# Single-architecture (arm64 — the runner's native arch). A universal arm64+x86_64 DMG needs a
# zig cross-compile of libghostty and is tracked as a follow-up.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.3 (required for a tag-less manual run)'
        required: false

# Read-only: this workflow only produces an artifact. Nothing here writes to the repo or a Release.
permissions:
  contents: read

# Never cancel an in-flight release build: the signing step downloads this artifact by run id, and a
# half-built run is worse than a slow one. (ci.yml cancels superseded runs; a release must not.)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build the release DMG
    # macos-26 for the same reason as ci.yml: the SwiftLint build-tool plugin on the inner layers
    # needs Swift >= 6.2 (the prebuild-command fix), which older runner images don't carry.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Version is the source of truth for both CFBundleShortVersionString and CFBundleVersion
      # (package-app.sh writes them into Info.plist; the About window reads them, and Sparkle
      # compares the latter against the feed). From a tag push it's `${GITHUB_REF_NAME#v}`
      # (v1.2.3 → 1.2.3); a manual dispatch must pass `version` explicitly. `tag` re-adds the `v`
      # so the Release tag is canonical regardless of how `version` was given.
      - name: Derive version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            V="${INPUT_VERSION#v}"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            echo "::error::No version — a workflow_dispatch on a non-tag ref must pass the 'version' input." >&2
            exit 1
          fi
          [ -n "$V" ] || { echo "::error::Derived an empty version." >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Releasing version $V (tag v$V)"

      # Share the release-build caches with ci.yml's `package` job (same keys).
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-release-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-release-
            ${{ runner.os }}-spm-

      - name: Cache libghostty
        id: ghostty
        uses: actions/cache@v4
        with:
          path: Vendor/libghostty.a
          key: ${{ runner.os }}-libghostty-${{ hashFiles('scripts/build-libghostty.sh') }}

      # Only on a cache miss: ghostty compiles Metal shaders at build time, so the Metal Toolchain
      # (a separately-downloaded Xcode component) must be present before build-libghostty.sh runs.
      - name: Download Metal Toolchain
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build libghostty
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: bash scripts/build-libghostty.sh

      - name: Build Bosun (release)
        # --disable-sandbox: the SwiftLint build-tool plugin on the inner layers needs to run
        # unsandboxed. --product Bosun builds the app executable, which links Vendor/libghostty.a.
        run: swift build -c release --disable-sandbox --product Bosun

      - name: Package .app + .dmg
        # Ad-hoc signed on purpose: this is the input to the hand-signing step, never a shippable
        # build. Nothing downstream of here can publish it.
        #
        # BUILD is the release version, NOT github.run_number. It lands in CFBundleVersion, and that
        # is the value Sparkle's default comparator assesses the feed against: the appcast entry
        # carries <sparkle:version>1.0.1</sparkle:version>, which Sparkle compares against the
        # installed app's CFBundleVersion. A run number ("137") compares as far newer than any
        # "1.0.1", so every future update would be judged older and silently never offered — no
        # error, just an app that stops updating. Whatever is baked in here is what every later
        # comparison is made against, so it must be right before the FIRST release ships.
        env:
          CONFIG: release
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.version }}
        run: bash scripts/package-app.sh

      # An artifact, not a Release asset. The signing step looks this run up by tag and pulls the
      # artifact down by name, so `Bosun-dmg` is a contract with that script — renaming it here
      # breaks the release with a "no artifact matches" error on the other side.
      #
      # Artifacts expire (90 days by default). That is fine: this is a build input, and the shippable
      # artefact of a release is the signed .dmg attached to the Release, which never expires.
      - name: Upload Bosun.dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bosun-dmg
          path: dist/Bosun.dmg
          if-no-files-found: error

