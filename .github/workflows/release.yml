name: Release

# Tag → notarized DMG → draft GitHub Release.
#
# Push a `v*` tag (e.g. `v1.2.3`) and this builds the full libghostty-linked Bosun app, signs +
# notarizes + staples it (Developer ID, when the repo secrets are set), rolls Bosun.dmg, and
# attaches it to a DRAFT GitHub Release for the maintainer to review and publish. The build path
# mirrors ci.yml's `package` job; the difference is the trigger (a tag, not a master push), the
# version (derived from the tag, not 0.0.0-<sha>), and the output (a Release, not an artifact).
#
# Single-architecture (arm64 — the runner's native arch). A universal arm64+x86_64 DMG needs a
# zig cross-compile of libghostty and is tracked as a follow-up.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.3 (required for a tag-less manual run)'
        required: false

# Create the GitHub Release + its tag and upload the .dmg asset.
permissions:
  contents: write

# Never cancel an in-flight release: notarization can take minutes and a half-submitted build is
# worse than a slow one. (ci.yml cancels superseded runs; a release must not.)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize & draft release
    # macos-26 for the same reason as ci.yml: the SwiftLint build-tool plugin on the inner layers
    # needs Swift >= 6.2 (the prebuild-command fix), which older runner images don't carry.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Version is the source of truth for both CFBundleShortVersionString and CFBundleVersion
      # (package-app.sh writes them into Info.plist; the About window reads them, and Sparkle
      # compares the latter against the feed). From a tag push it's `${GITHUB_REF_NAME#v}`
      # (v1.2.3 → 1.2.3); a manual dispatch must pass `version` explicitly. `tag` re-adds the `v`
      # so the Release tag is canonical regardless of how `version` was given.
      - name: Derive version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            V="${INPUT_VERSION#v}"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            echo "::error::No version — a workflow_dispatch on a non-tag ref must pass the 'version' input." >&2
            exit 1
          fi
          [ -n "$V" ] || { echo "::error::Derived an empty version." >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Releasing version $V (tag v$V)"

      # Share the release-build caches with ci.yml's `package` job (same keys).
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-release-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-release-
            ${{ runner.os }}-spm-

      - name: Cache libghostty
        id: ghostty
        uses: actions/cache@v4
        with:
          path: Vendor/libghostty.a
          key: ${{ runner.os }}-libghostty-${{ hashFiles('scripts/build-libghostty.sh') }}

      # Only on a cache miss: ghostty compiles Metal shaders at build time, so the Metal Toolchain
      # (a separately-downloaded Xcode component) must be present before build-libghostty.sh runs.
      - name: Download Metal Toolchain
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build libghostty
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: bash scripts/build-libghostty.sh

      - name: Build Bosun (release)
        # --disable-sandbox: the SwiftLint build-tool plugin on the inner layers needs to run
        # unsandboxed. --product Bosun builds the app executable, which links Vendor/libghostty.a.
        run: swift build -c release --disable-sandbox --product Bosun

      - name: Package .app + .dmg
        # Ad-hoc signed on purpose. The draft release this attaches to is NOT shippable until it is
        # signed and notarized by hand, which must happen BEFORE publishing, because publishing
        # triggers appcast.yml and ships whatever is attached.
        #
        # BUILD is the release version, NOT github.run_number. It lands in CFBundleVersion, and that
        # is the value Sparkle's default comparator assesses the feed against: update-appcast.py
        # emits <sparkle:version>1.0.1</sparkle:version>, which Sparkle compares against the
        # installed app's CFBundleVersion. A run number ("137") compares as far newer than any
        # "1.0.1", so every future update would be judged older and silently never offered — no
        # error, just an app that stops updating. Whatever is baked in here is what every later
        # comparison is made against, so it must be right before the FIRST release ships.
        env:
          CONFIG: release
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.version }}
        run: bash scripts/package-app.sh

      # Draft so a human reviews + publishes (per the release policy). --generate-notes fills the
      # body from merged PRs/commits since the previous release. On a manual dispatch gh creates
      # the tag on publish; on a tag push it reuses the pushed tag.
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/Bosun.dmg \
            --draft \
            --generate-notes \
            --title "Bosun $VERSION"

