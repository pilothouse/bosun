name: Appcast

# Publish the signed Sparkle appcast when a GitHub Release is published.
#
# release.yml builds a tag into an ad-hoc signed Bosun.dmg attached to a DRAFT release. A human then
# signs and notarizes it by hand and *publishes* it. This workflow fires on that publish (not the
# draft), so the appcast only ever advertises a build whose assets are live and already signed. It
# signs the published DMG with the EdDSA private key, prepends an <item>
# to the cumulative appcast.xml (committed in the repo), and uploads appcast.xml as a Release asset — so
# the app's feed URL, https://github.com/pilothouse/bosun/releases/latest/download/appcast.xml, always
# resolves to the newest published release's appcast.
#
# The sign-before-publish ordering is enforced here, not merely assumed: the job refuses to run
# unless the attached Bosun.dmg assesses as a notarized Developer ID build. See the verify step.
#
# NO-OP without the SPARKLE_ED_PRIVATE_KEY secret (forks): the appcast can't be signed, so the job exits 0
# without touching anything — exactly like notarize.sh degrades without Apple credentials.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build the appcast for, e.g. v1.2.3'
        required: true

permissions:
  contents: write

concurrency:
  group: appcast
  cancel-in-progress: false

jobs:
  appcast:
    name: Sign DMG & publish appcast
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$EVENT_TAG}"
          [ -n "$TAG" ] || { echo "::error::No release tag to build an appcast for." >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Guard — require the signing key
        id: guard
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY not set — skipping appcast (no-op)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Sparkle CLI tools
        if: steps.guard.outputs.skip != 'true'
        env:
          SPARKLE_VERSION: 2.9.3
        run: |
          set -euo pipefail
          curl -fsSL -o sparkle-tools.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle-tools
          tar -xJf sparkle-tools.tar.xz -C sparkle-tools bin/sign_update
          ./sparkle-tools/bin/sign_update --help >/dev/null

      - name: Download the published DMG
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: gh release download "$TAG" --pattern 'Bosun.dmg' --dir .

      # The gate that enforces sign-BEFORE-publish. release.yml attaches an AD-HOC signed .dmg to the
      # draft; the maintainer replaces it with a Developer ID signed, notarized one and only then
      # publishes. If that step is skipped, everything below would sign the ad-hoc build with the
      # Sparkle key and ship it as an update, and every existing user would be offered a build
      # Gatekeeper refuses to open. There is no clean undo: the appcast entry is signed and out, so
      # the only fix is cutting a new version. Hence a hard failure here rather than a warning.
      #
      # Both the disk image AND the app inside it are checked. A .dmg-only check would pass a signed
      # image wrapped around an unsigned app. `spctl` is the same assessment Gatekeeper runs on a
      # user's Mac; `stapler validate` proves the ticket is embedded, so that assessment also holds
      # offline. "source=Notarized Developer ID" is the only acceptable answer.
      - name: Verify the DMG is signed and notarized
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # An explicit -mountpoint keeps this out of /Volumes, so a stale mount can never be picked
          # up by mistake on a re-run.
          MNT="$RUNNER_TEMP/dmg-mnt"
          mkdir -p "$MNT"
          hdiutil attach Bosun.dmg -nobrowse -readonly -mountpoint "$MNT" >/dev/null
          trap 'hdiutil detach "$MNT" >/dev/null 2>&1 || true' EXIT

          # spctl exits non-zero when it rejects, so capture rather than pipe: `|| true` keeps set -e
          # from killing the run before the reason can be printed, and avoids a `| grep -q` pipeline
          # whose early exit would trip pipefail even on a match.
          DMG_OUT="$(spctl -a -t open --context context:primary-signature -vv Bosun.dmg 2>&1 || true)"
          APP_OUT="$(spctl -a -t exec -vv "$MNT/Bosun.app" 2>&1 || true)"
          printf '%s\n%s\n' "$DMG_OUT" "$APP_OUT"

          FAIL=0
          case "$DMG_OUT" in
            *"source=Notarized Developer ID"*) ;;
            *) echo "::error::Bosun.dmg is not a notarized Developer ID build."; FAIL=1 ;;
          esac
          case "$APP_OUT" in
            *"source=Notarized Developer ID"*) ;;
            *) echo "::error::Bosun.app inside the .dmg is not a notarized Developer ID build."; FAIL=1 ;;
          esac
          if ! xcrun stapler validate Bosun.dmg; then
            echo "::error::Bosun.dmg carries no stapled notarization ticket."
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Refusing to publish an appcast for a build that was not signed by hand. Sign and notarize the release asset, re-upload it over the unsigned one, then re-run this workflow (Actions → Appcast → Run workflow, with this tag)."
            exit 1
          fi
          echo "Both the .dmg and the .app are notarized Developer ID builds."

      - name: Sign DMG & update appcast.xml
        if: steps.guard.outputs.skip != 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ github.repository }}
          RELEASE_BODY: ${{ github.event.release.body }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail
          # Sign with the EdDSA private key via a temp key file (not argv, which `ps` would expose) →
          # "sparkle:edSignature=… length=…".
          KEYFILE="$(mktemp)"; printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEYFILE"
          SIG_LINE="$(./sparkle-tools/bin/sign_update --ed-key-file "$KEYFILE" Bosun.dmg)"
          rm -f "$KEYFILE"
          echo "signature: $SIG_LINE"
          # scripts/update-appcast.py prepends the signed <item> into the cumulative appcast.xml.
          export SIG_LINE
          export ENCLOSURE_URL="https://github.com/${REPO}/releases/download/${TAG}/Bosun.dmg"
          python3 scripts/update-appcast.py

      - name: Commit appcast.xml
        if: steps.guard.outputs.skip != 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- appcast.xml; then
            echo "No appcast change to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add appcast.xml
            # [skip ci] so the appcast commit doesn't kick off ci.yml.
            git commit -m "Appcast: add $TAG [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME:-master}" || git push origin HEAD:master
          fi

      - name: Upload appcast.xml to the Release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: gh release upload "$TAG" appcast.xml --clobber
